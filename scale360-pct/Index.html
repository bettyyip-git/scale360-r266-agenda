<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1F4E79;
  --blue: #2E75B6;
  --light-blue: #D6E4F0;
  --green: #059669;
  --green-bg: #ecfdf5;
  --green-border: #a7f3d0;
  --yellow: #d97706;
  --yellow-bg: #fffbeb;
  --yellow-border: #fde68a;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --gray: #6b7280;
  --gray-bg: #f9fafb;
  --border: #e5e7eb;
  --text: #111827;
  --text-secondary: #4b5563;
  --surface: #ffffff;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(160deg, #eef3f9, #e3ecf6);
  color: var(--text);
  padding: 24px;
  min-height: 100vh;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
}

.header {
  background: linear-gradient(135deg, #1e3a5f 0%, var(--navy) 40%, var(--blue) 100%);
  color: white;
  padding: 24px 32px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(30,78,121,0.2);
  position: relative;
  overflow: hidden;
}

.header::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -10%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
  border-radius: 50%;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}

.header-sub {
  font-size: 0.82rem;
  opacity: 0.8;
}

.header-meta {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 0.75rem;
  opacity: 0.7;
}

.summary-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.summary-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 600;
  box-shadow: var(--shadow);
}

.summary-chip .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-red { background: var(--red); }
.dot-done { background: #6b7280; }

.tracks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

.track-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}

.track-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.track-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.track-card.status-green::before { background: var(--green); }
.track-card.status-yellow::before { background: var(--yellow); }
.track-card.status-red::before { background: var(--red); }
.track-card.status-done::before { background: var(--gray); }

.track-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.track-name {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
  flex: 1;
  padding-right: 8px;
}

.track-badge {
  flex-shrink: 0;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.badge-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge-done { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--border); }

.track-owner {
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.track-progress-bar {
  height: 6px;
  background: #f3f4f6;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 10px;
}

.track-progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}

.fill-green { background: linear-gradient(90deg, #34d399, var(--green)); }
.fill-yellow { background: linear-gradient(90deg, #fbbf24, var(--yellow)); }
.fill-red { background: linear-gradient(90deg, #f87171, var(--red)); }
.fill-done { background: linear-gradient(90deg, #9ca3af, #6b7280); }

.track-comment {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.5;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}

.track-notes {
  font-size: 0.72rem;
  color: var(--gray);
  margin-top: 6px;
  font-style: italic;
}

.loading {
  text-align: center;
  padding: 60px;
  color: var(--text-secondary);
  font-size: 0.9rem;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 0.72rem;
  color: var(--gray);
}

.footer a {
  color: var(--blue);
  text-decoration: none;
}

@media (max-width: 768px) {
  .tracks-grid { grid-template-columns: 1fr; }
  body { padding: 12px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>SRx SoS Tracks</h1>
    <div class="header-sub">HCC V2MOM 2.5.x — Seamless Release Experience Workstream Status</div>
    <div class="header-meta">
      <span>Source: HCC FY27 V2MOM Scorecard</span>
      <span>Last refreshed: <span id="refresh-time">—</span></span>
    </div>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div class="tracks-grid" id="tracks-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading track data from V2MOM scorecard...
    </div>
  </div>

  <div class="footer">
    Data from <a href="https://docs.google.com/spreadsheets/d/1ufYd6q4YhSUDFFRJpXgjuwoPcKKugd0SB0oOHlj06fM/edit?gid=649674725#gid=649674725" target="_blank">HCC FY27 V2MOM</a> (rows 25–33, columns C/E/L/M/N)
  </div>
</div>

<script>
function classifyStatus(raw) {
  const s = (raw || '').toLowerCase();
  if (s.includes('done') || s.includes('complete') || s.includes('✅')) return 'done';
  if (s.includes('red') || s.includes('🔴') || s.includes('off-track') || s.includes('at risk')) return 'red';
  if (s.includes('yellow') || s.includes('🟡') || s.includes('amber')) return 'yellow';
  return 'green';
}

function statusLabel(cls) {
  if (cls === 'done') return 'Done';
  if (cls === 'red') return 'At Risk';
  if (cls === 'yellow') return 'Watch';
  return 'On Track';
}

function progressPercent(cls, progressText) {
  if (cls === 'done') return 100;
  const match = (progressText || '').match(/(\d+)\s*%/);
  if (match) return parseInt(match[1]);
  if (cls === 'green') return 75;
  if (cls === 'yellow') return 50;
  if (cls === 'red') return 30;
  return 0;
}

function renderTracks(tracks) {
  const grid = document.getElementById('tracks-grid');
  const summary = document.getElementById('summary-bar');

  if (!tracks || tracks.length === 0) {
    grid.innerHTML = '<div class="loading">No data found. Check spreadsheet permissions.</div>';
    return;
  }

  // Count statuses
  const counts = { green: 0, yellow: 0, red: 0, done: 0 };
  tracks.forEach(t => {
    const cls = classifyStatus(t.status);
    counts[cls]++;
  });

  // Summary chips
  summary.innerHTML = `
    <div class="summary-chip"><span class="dot dot-green"></span> ${counts.green} On Track</div>
    <div class="summary-chip"><span class="dot dot-yellow"></span> ${counts.yellow} Watch</div>
    <div class="summary-chip"><span class="dot dot-red"></span> ${counts.red} At Risk</div>
    <div class="summary-chip"><span class="dot dot-done"></span> ${counts.done} Done</div>
    <div class="summary-chip" style="margin-left:auto;color:var(--text-secondary);font-weight:500;">${tracks.length} total measures</div>
  `;

  // Render cards
  grid.innerHTML = tracks.map(t => {
    const cls = classifyStatus(t.status);
    const pct = progressPercent(cls, t.progress);
    const label = statusLabel(cls);

    return `
      <div class="track-card status-${cls}">
        <div class="track-header">
          <div class="track-name">${escapeHtml(t.measure)}</div>
          <span class="track-badge badge-${cls}">${label}</span>
        </div>
        <div class="track-owner">${escapeHtml(t.owner)}</div>
        <div class="track-progress-bar">
          <div class="track-progress-fill fill-${cls}" style="width:${pct}%"></div>
        </div>
        <div class="track-comment">${escapeHtml(t.progress)}</div>
        ${t.notes ? `<div class="track-notes">${escapeHtml(t.notes)}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('refresh-time').textContent = new Date().toLocaleString();
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Load data from Apps Script backend
google.script.run
  .withSuccessHandler(renderTracks)
  .withFailureHandler(function(err) {
    document.getElementById('tracks-grid').innerHTML =
      '<div class="loading" style="color:var(--red);">Error loading data: ' + err.message + '</div>';
  })
  .getTrackData();
</script>

</body>
</html>
